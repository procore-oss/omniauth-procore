name: "Pull Request Labeler"
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@98ce1450c7908643084f7487327dfa4f4bf8a367 # (latest, untagged)
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
