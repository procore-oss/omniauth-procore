name: "Pull Request Labeler"
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@2c2a2313b245ae5cb1ddbddf76be67b266211c91 # (latest, untagged)
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
