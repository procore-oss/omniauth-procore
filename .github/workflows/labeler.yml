name: "Pull Request Labeler"
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bc32c493030cc908233048429a1f81da3057fbbc # (latest, untagged)
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
