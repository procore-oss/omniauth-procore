name: 'Auto Author Assign'
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@6777e6c2a2e817abbc19dabe9e1b749e01536a72 # (latest, untagged)
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
