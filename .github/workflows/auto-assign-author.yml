name: 'Auto Author Assign'
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@5287094cfc00243749d1a0d45e7b93cc56cc3feb # (latest, untagged)
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
