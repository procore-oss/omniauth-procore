name: 'Auto Author Assign'
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a # (latest, untagged)
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
